[package]
name = "kidpix"
description = "Kid Pix Deluxe 3 revival engine: runs the original data from your own CD on Windows, Linux and macOS"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kidpix-revival"
path = "src/main.rs"

[dependencies]
mohawk = { path = "../mohawk" }
kp-import = { path = "../kp-import" }
kp-swf = { path = "../kp-swf" }
kp-kpx = { path = "../kp-kpx" }
kp-brushes = { path = "../kp-brushes" }
kp-lex = { path = "../kp-lex" }
kp-qt = { path = "../kp-qt" }
winit = "0.30"
softbuffer = "0.4"
cpal = "0.15"
png = "0.17"
rfd = "0.15"
fontdue = "0.9"
directories = "5"
miniz_oxide = "0.8"
zune-jpeg = "0.4"
jpeg-encoder = "0.6"
gif = "0.13"
